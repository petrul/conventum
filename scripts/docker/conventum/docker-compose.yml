# Prod runner for Conventum (the only environment for now). Deployed on
# srv2.local; the image is published by `rake ci` on the build machine:
#   ssh srv2.local
#   cd ~/work/conventum && git pull            # or copy this directory
#   docker compose -f scripts/docker/conventum/docker-compose.yml up -d
# Compose only pulls the published image and starts it - no build here.
name: conventum

services:
  conventum:
    image: mini.local:5000/editii/conventum:0.0.1-SNAPSHOT
    container_name: conventum-prod
    env_file:
      - prod.env
    ports:
      # Published on all interfaces so Caddy on zmeu.local can reach
      # srv2.local:8040 (see scripts/caddy/Caddyfile); the public entry point
      # is https://scriptorium.ro/conventum/ via Caddy.
      - "8040:8040"
    restart: unless-stopped
