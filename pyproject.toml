[project]
name = "dic"
version = "0.0.1+SNAPSHOT"
license = "Apache-2.0"
description = "Explore Romanian word origins from Wiktionary dumps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mwparserfromhell>=0.7.2,<0.8"]

[project.scripts]
dic = "dic.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
